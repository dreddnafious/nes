# I7: the MMC1 test ROMs. Read by test_i7_mapper_roms.py. Each ROM is fetched by hash (cases/i7_oracles.json).
#
# kind: mapperel. Holy Mapperel v0.02 (Damian Yerrick, zlib), its MMC1 builds (cut from the pinned release
# archive). It detects the mapper by how the board answers mirroring and bank writes, measures PRG, CHR
# and PRG-RAM from the bank tags it finds, tests every bank, and shows the result on screen (src/main.s,
# README "Displayed result"), read with the font from the ROM's own CHR-ROM build (as I6 reads it; '0' and
# 'O' share a glyph, so O reads as 0):
#   - the mapper and board: "001 S" + the board letter + "R0M (MMC1)", the letter from boardletter.s's
#     table of PRG, CHR and PRG-RAM sizes (SL: 128K CHR-ROM, no PRG-RAM; SK: with 8K; SF/SJ: 32K CHR-ROM
#     without/with; SG: 8K CHR-RAM, no PRG-RAM; SU: 512K, 8K; SX: 512K, 32K), so the board line holds only
#     if the PRG-RAM the header's NES 2.0 sizes give is the PRG-RAM the program finds;
#   - "<n>K PRG R0M"; the PRG-RAM line ("PRG RAM MISSING", or "<n>K PRG RAM 0K"; a battery build shows
#     " + BATTERY" only when its "SAVEDATA" tag survived from an earlier run, so never at a first power-on);
#     the CHR line ending "0K";
#   - "DETAILED TEST RESULT: wpic", where "Zero is normal; anything else reflects something unexpected"
#     (w WRAM, p PRG ROM, i IRQ, c CHR). The WRAM digit is 1 when "$E000 bit 4 does not disable WRAM",
#     which is MMC1A's behaviour and not MMC1B's (NESdev "MMC1", ASIC Revisions): the revision isn't
#     pinned, so on builds with PRG-RAM the digit may be 0 or 1. A 4 ("$A000 bit 4 disables WRAM (all but
#     SNROM)") or any other digit fails.
#
# kind: blargg. blargg's multi-test builds of suites whose single-test builds the corpus already runs on
# NROM (I1, I2, I4); these are MMC1 (iNES 1.0, 8 KiB CHR-RAM, PRG-RAM at $6000 for the $6000 protocol), each
# test in its own PRG bank. Run through the frozen cases/drive.ts: the signature DE B0 61, status $00, and
# the text's last line "All N tests passed" (readme "Multi-tests": "The final result code refers to the
# first sub-test that failed").
cases:
  - id: holy-mapperel/M1_P128K_C128K
    kind: mapperel
    purpose: Holy Mapperel on SLROM (128 KiB PRG, 128 KiB CHR-ROM, no PRG-RAM in the NES 2.0 header) detects mapper 1 as SLROM, reads back 128K of PRG ROM and all 32 4 KiB CHR banks' tags, finds no PRG-RAM, and reports detailed result 0000.
    origin: design
    delta: true
    board: "001 SLR0M \\(MMC1\\)"
    prg: "128K PRG R0M"
    wram: "PRG RAM MISSING"
    chr: "128K CHR R0M 0K"
    detail: "DETAILED TEST RESULT: 0000"
  - id: holy-mapperel/M1_P128K_C128K_S8K
    kind: mapperel
    purpose: Holy Mapperel on SKROM with 8 KiB of battery-backed PRG-RAM detects SKROM, reads back 128K of PRG ROM, 8K of PRG-RAM and 128K of CHR ROM, and reports detailed result 0000 (or 1000, the MMC1A reading of $E000 bit 4).
    origin: design
    delta: true
    board: "001 SKR0M \\(MMC1\\)"
    prg: "128K PRG R0M"
    wram: "8K PRG RAM 0K"
    chr: "128K CHR R0M 0K"
    detail: "DETAILED TEST RESULT: [01]000"
  - id: holy-mapperel/M1_P128K_C128K_W8K
    kind: mapperel
    purpose: Holy Mapperel on SKROM with 8 KiB of PRG-RAM and no battery detects SKROM, reads back 128K of PRG ROM, 8K of PRG-RAM and 128K of CHR ROM, and reports detailed result 0000 (or 1000).
    origin: design
    delta: true
    board: "001 SKR0M \\(MMC1\\)"
    prg: "128K PRG R0M"
    wram: "8K PRG RAM 0K"
    chr: "128K CHR R0M 0K"
    detail: "DETAILED TEST RESULT: [01]000"
