# I8: the MMC3 test ROMs. Read by test_i8_mapper_roms.py. Each ROM is fetched by hash (cases/i8_oracles.json).
#
# kind: blargg. blargg's mmc3_test_2 singles (iNES 1.0, mapper 4, 32 KiB PRG, 8 KiB CHR-ROM): "These tests
# verify a small part of MMC3 (and some MMC6) behavior, mostly related to the scanline counter and IRQ ...
# They should be run in order" (readme). They clock the counter by hand through $2006 (1-3, 5, 6) and time
# the IRQ to the PPU clock with rendering on (2's last test, 4). Run through the frozen cases/drive.ts: the
# signature DE B0 61, status $00, and the text. They report through PRG-RAM at $6000 they never enable
# through $A001 (an iNES 1.0 file, where the wiki says "many implementations ... simply omit the write
# protection"; open item).
#
# 6-MMC3_alt tests the "alternate" behaviour (Sharp MMC3A, NEC MMC3: "only generates IRQs when the scanline
# counter changes (decrements) to zero from a non-zero value"). Decided Q2 targets the MMC3B/C (the "new"
# behaviour, NES 2.0 submapper 0), on which it can't pass: per Decided Q2 the ROM stays red in the raw
# accuracy count, reported as expected-fail with that reason, and in the denominator. The corpus doesn't
# hold a case that asks it to pass (no right build could meet one). It pins the ROM through its one entry
# here, kind blargg_status: the right failure, for the right reason. On the MMC3B/C its first sub-test (2,
# "IRQ shouldn't be set when reloading to 0 due to counter naturally reaching 0 previously") fails, and no
# other.
#
# kind: mapperel. Holy Mapperel v0.02 (Damian Yerrick, zlib), its MMC3 builds, cut from the pinned release
# archive. It detects the board from the header's NES 2.0 sizes and what the cartridge answers, reads back
# every PRG bank's tag through each of the four PRG windows (R6 and R7, in both PRG modes: $06, $07, $46,
# $47), every CHR bank's tag through each 1 KiB window in both CHR inversions, checks that the IRQ comes 3
# times in a frame with $C000 = 64 and the background alone on ("Test that IRQ line is connected",
# src/mmc3drivers.s), and tests the PRG-RAM's $A001 protection only when it found PRG-RAM. Its screen
# (src/main.s), read with the font from its own CHR-ROM build (as I6 reads it; '0' and 'O' share a glyph):
#   - "004 " + the board letters from boardletter.s's table + "R0M (MMC3)": TG (8 KiB CHR, no PRG-RAM), TF
#     (16-64 KiB CHR, no PRG-RAM), TL (128-256 KiB CHR, no PRG-RAM); a board that gave these files PRG-RAM
#     their NES 2.0 headers don't declare would read TN, TS or TK instead;
#   - "<n>K PRG R0M", "PRG RAM MISSING", "<n>K CHR R0M 0K" or "<n>K CHR RAM 0K";
#   - "DETAILED TEST RESULT: " + two hex bytes, the PRG result (windows 1-4, PRG-RAM protection) and the
#     CHR result (CHR tags, $10 for the IRQ): 0000 when all is well.
cases:
  - id: mmc3_test_2/1-clocking
    kind: blargg
    purpose: blargg mmc3_test_2 1-clocking (the counter clocked through $2006; reload, decrement, $C000 and $C001, the IRQ at 0, disabled) reports passed.
    origin: design
    delta: true
  - id: mmc3_test_2/2-details
    kind: blargg
    purpose: blargg mmc3_test_2 2-details (a latch of 255, the counter running while disabled and after the IRQ, $C001 setting no IRQ, and 241 clocks in a rendered frame) reports passed.
    origin: design
    delta: true
  - id: mmc3_test_2/3-A12_clocking
    kind: blargg
    purpose: blargg mmc3_test_2 3-A12_clocking (clocked only by a rise of PPU A12, by a $2006 write or a $2007 read or write) reports passed.
    origin: design
    delta: true
  - id: mmc3_test_2/4-scanline_timing
    kind: blargg
    purpose: blargg mmc3_test_2 4-scanline_timing (the IRQ on scanlines 0, 1 and 239 to the PPU clock, with $2000 = $08 and $10) reports passed.
    origin: design
    delta: true
  - id: mmc3_test_2/5-MMC3
    kind: blargg
    purpose: blargg mmc3_test_2 5-MMC3 (the MMC3B/C's latch-0 behaviour, an IRQ at every clock) reports passed.
    origin: design
    delta: true
  - id: mmc3_test_2/6-MMC3_alt
    kind: blargg_status
    purpose: on the MMC3B/C, blargg mmc3_test_2 6-MMC3_alt fails exactly at its sub-test 2, the alternate revision's first difference (a reload to 0 after the counter reached 0 by itself sets no IRQ there), reporting status 2.
    origin: design
    status: 2
    text: "IRQ shouldn't be set when reloading to 0 due to counter naturally reaching 0 previously"
    delta: true
  - id: holy-mapperel/M4_P128K_CR8K
    kind: mapperel
    purpose: Holy Mapperel on TGROM (128 KiB PRG, 8 KiB CHR-RAM, no PRG-RAM in the NES 2.0 header) detects mapper 4 as TGROM, reads back 128K of PRG ROM through all four windows and the CHR-RAM through every 1 KiB window, finds no PRG-RAM, sees 3 IRQs in its frame, and reports detailed result 0000.
    origin: design
    board: "004 TGR0M \\(MMC3\\)"
    prg: "128K PRG R0M"
    wram: "PRG RAM MISSING"
    chr: "8K CHR RAM 0K"
    detail: "DETAILED TEST RESULT: 0000"
    delta: true
  - id: holy-mapperel/M4_P128K_CR32K
    kind: mapperel
    purpose: Holy Mapperel on an MMC3 board with 32 KiB of CHR-RAM (NES 2.0 byte 11) detects TFROM, reads back 128K of PRG ROM and all 32 1 KiB CHR-RAM banks, finds no PRG-RAM, and reports detailed result 0000.
    origin: design
    board: "004 TFR0M \\(MMC3\\)"
    prg: "128K PRG R0M"
    wram: "PRG RAM MISSING"
    chr: "32K CHR RAM 0K"
    detail: "DETAILED TEST RESULT: 0000"
    delta: true
  - id: holy-mapperel/M4_P256K_C256K
    kind: mapperel
    purpose: Holy Mapperel on TLROM (256 KiB PRG, 256 KiB CHR-ROM, the MMC3's CHR limit; a 512 KiB file) detects TLROM, reads back all 256K of PRG ROM and all 256 CHR bank tags, finds no PRG-RAM, and reports detailed result 0000.
    origin: design
    board: "004 TLR0M \\(MMC3\\)"
    prg: "256K PRG R0M"
    wram: "PRG RAM MISSING"
    chr: "256K CHR R0M 0K"
    detail: "DETAILED TEST RESULT: 0000"
    delta: true
